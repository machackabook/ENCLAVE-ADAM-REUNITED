name: tikemachine-hourly
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: append hourly stamp
        run: |
          mkdir -p docs
          echo "- $(date -u +%Y-%m-%dT%H:%M:%SZ) tikemachine-hourly stage 119 numeral 137451921129154222" >> docs/LEDGER.md
      - name: commit if dirty
        run: |
          git config user.name "continuity-engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LEDGER.md
          git diff --cached --quiet || git commit -m "hourly tikemachine stamp 137451921129154222"
          git push || true
