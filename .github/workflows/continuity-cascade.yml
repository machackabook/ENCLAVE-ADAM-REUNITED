name: continuity-cascade
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "41 * * * *"
jobs:
  env-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: env and structure
        run: |
          echo "numeral=137451921129154222"
          echo "repo=${{ github.repository }}"
          echo "sha=${{ github.sha }}"
          ls -la
          test -f README.md
          test -f SECURITY.md
      - name: cascade note
        run: |
          echo "waterfall: ENCLAVE-ADAM-REUNITED is the open enclave surface"
          echo "sparsebundle + SYNAPSE + Termux + end/exit node"
