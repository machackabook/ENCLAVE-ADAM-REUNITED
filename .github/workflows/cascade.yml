name: cascade-hourly
on:
  schedule:
    - cron: "21 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  repository_dispatch:
    types: [continuity-cascade, pull-then-push]
permissions:
  contents: write
  actions: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: env-check
        run: |
          mkdir -p docs scripts
          chmod +x scripts/env-check.sh || true
          if [ -f scripts/env-check.sh ]; then bash scripts/env-check.sh; fi
      - name: stamp
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          HASH=$(printf '%s' "$TS-137451921129154222-enclave" | sha256sum | awk '{print $1}')
          {
            echo "# LEDGER-STAMP"
            echo "- utc: $TS"
            echo "- numeral: 137451921129154222"
            echo "- surface: ENCLAVE-ADAM-REUNITED"
            echo "- team: enhance"
            echo "- version: v1.3.0-enhance"
            echo "- next: Cryptic-Heartbeat"
            echo "- sha256: \`$HASH\`"
          } > docs/LEDGER-STAMP.md
          git config user.name "continuity-engine"
          git config user.email "continuity@local"
          git add docs/LEDGER-STAMP.md || true
          git diff --cached --quiet || git commit -m "enclave: team-enhance stamp (137451921129154222)"
          git push || true
      - name: waterfall-dispatch
        if: ${{ secrets.CASCADE_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.CASCADE_TOKEN }}
        run: |
          for REPO in Cryptic-Heartbeat The-Hive gaia-visualizer nexus-repo-sync; do
            curl -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/machackabook/$REPO/dispatches" \
              -d '{"event_type":"continuity-cascade"}' || true
          done
