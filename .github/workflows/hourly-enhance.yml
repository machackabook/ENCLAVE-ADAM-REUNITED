name: continuity-hourly-enhance
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: append ledger tick
        run: |
          mkdir -p ledger
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) TICK 137451921129154222 enhance-alive" >> ledger/hourly.log
      - name: commit if dirty
        run: |
          git config user.name "continuity-engine"
          git config user.email "continuity@users.noreply.github.com"
          git add ledger/hourly.log CONTINUITY_PIPELINE.md || true
          git diff --cached --quiet || git commit -m "ledger: hourly enhance tick ${GITHUB_SHA:-local}"
          git push || true
